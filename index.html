                                            <label className="block text-sm font-medium text-slate-300 mb-2">Number of Breaks</label>
                                            <div className="flex items-center gap-4">
                                                <button onClick={() => setNumBreaks(Math.max(0, numBreaks - 1))} className="px-4 py-2 bg-slate-800 rounded-lg text-white">-</button>
                                                <span className="text-amber-400 text-xl">{numBreaks}</span>
                                                <button onClick={() => setNumBreaks(Math.min(5, numBreaks + 1))} className="px-4 py-2 bg-slate-800 rounded-lg text-white">+</button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Break Duration</label>
                                            <div className="flex items-center gap-4">
                                                <button onClick={() => setBreakDuration(Math.max(1, breakDuration - 1))} className="px-4 py-2 bg-slate-800 rounded-lg text-white">-1m</button>
                                                <span className="text-amber-400 text-xl">{breakDuration} min</span>
                                                <button onClick={() => setBreakDuration(Math.min(15, breakDuration + 1))} className="px-4 py-2 bg-slate-800 rounded-lg text-white">+1m</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="text-center mb-6">
                                    <div className={`text-6xl font-bold mb-2 ${timerPhase === 'break' ? 'text-green-400' : 'text-white'}`}>
                                        {formatTime(timerSeconds)}
                                    </div>
                                    <div className="text-sm text-slate-400">
                                        {timerPhase === 'break' ? `Break ${currentBreak}/${numBreaks}` : `Focus Session`}
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <button onClick={startTimer} disabled={timerRunning} className="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition-all disabled:opacity-50">
                                        {timerRunning ? 'Running...' : 'Start'}
                                    </button>
                                    <button onClick={resetTimer} className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-all">
                                        Reset
                                    </button>
                                </div>

                                {sessionLog.length > 0 && (
                                    <div className="mt-6 pt-6 border-t border-slate-700">
                                        <h4 className="text-sm font-semibold text-amber-400 mb-3">Recent Sessions</h4>
                                        <div className="space-y-2 max-h-32 overflow-y-auto">
                                            {sessionLog.slice(-3).reverse().map((session, index) => (
                                                <div key={index} className="text-xs text-slate-400 flex justify-between">
                                                    <span>{session.date} - {session.completedAt}</span>
                                                    <span>{session.duration}m focus, {session.breaks} breaks</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {showModal === 'note' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-sm">
                            <div className="relative w-full max-w-md p-8 bg-slate-900/90 border border-amber-500/30 rounded-lg shadow-[0_0_30px_rgba(251,191,36,0.2)] max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setShowModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-amber-400 transition-colors">
                                    ✕
                                </button>
                                <h3 className="text-2xl font-bold text-amber-400 mb-6">Quick Notes</h3>
                                
                                <textarea
                                    value={noteText}
                                    onChange={(e) => setNoteText(e.target.value)}
                                    placeholder="Jot down your thoughts..."
                                    className="w-full h-32 px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:border-amber-500 outline-none resize-none mb-4"
                                />
                                <button onClick={saveNote} className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition-all mb-6">
                                    Save Note
                                </button>

                                {savedNotes.length > 0 && (
                                    <div>
                                        <h4 className="text-lg font-semibold text-amber-400 mb-4">Saved Notes</h4>
                                        <div className="space-y-3 max-h-60 overflow-y-auto">
                                            {savedNotes.map((note) => (
                                                <div key={note.id} className="p-4 bg-slate-800/50 border border-slate-700 rounded-lg">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-xs text-slate-400">{note.date} - {note.time}</span>
                                                        <button
                                                            onClick={() => deleteNote(note.id)}
                                                            className="text-xs text-red-400 hover:text-red-300"
                                                        >
                                                            Delete
                                                        </button>
                                                    </div>
                                                    <p className="text-white text-sm whitespace-pre-wrap">{note.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {showModal === 'goal' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-sm">
                            <div className="relative w-full max-w-md p-8 bg-slate-900/90 border border-amber-500/30 rounded-lg shadow-[0_0_30px_rgba(251,191,36,0.2)]">
                                <button onClick={() => setShowModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-amber-400 transition-colors">
                                    ✕
                                </button>
                                <h3 className="text-2xl font-bold text-amber-400 mb-6">Set Daily Goal</h3>
                                <input
                                    type="text"
                                    value={goalText}
                                    onChange={(e) => setGoalText(e.target.value)}
                                    placeholder="e.g., Complete 3 study sessions"
                                    className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:border-amber-500 outline-none mb-4"
                                />
                                <button onClick={saveGoal} className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition-all">
                                    Set Goal
                                </button>
                            </div>
                        </div>
                    )}

                    {showModal === 'addSubject' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-sm">
                            <div className="relative w-full max-w-md p-8 bg-slate-900/90 border border-amber-500/30 rounded-lg shadow-[0_0_30px_rgba(251,191,36,0.2)]">
                                <button onClick={() => setShowModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-amber-400 transition-colors">
                                    ✕
                                </button>
                                <h3 className="text-2xl font-bold text-amber-400 mb-6">Add New Subject</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">Subject Name</label>
                                        <input
                                            type="text"
                                            value={newSubject.name}
                                            onChange={(e) => setNewSubject({ ...newSubject, name: e.target.value })}
                                            placeholder="e.g., Advanced Potions"
                                            className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:border-amber-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">Difficulty</label>
                                        <select
                                            value={newSubject.difficulty}
                                            onChange={(e) => setNewSubject({ ...newSubject, difficulty: e.target.value })}
                                            className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:border-amber-500 outline-none"
                                        >
                                            <option value="Easy">Easy</option>
                                            <option value="Medium">Medium</option>
                                            <option value="Hard">Hard</option>
                                        </select>
                                    </div>
                                    <button onClick={() => setShowModal(null)} className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition-all">
                                        Add Subject
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Spaced Plan View
        function SpacedPlanView({ userData, completedTasks, onTaskComplete }) {
            if (!userData) {
                return (
                    <div className="container mx-auto px-4 py-8">
                        <div className="text-center">
                            <p className="text-slate-400">Loading your study plan...</p>
                        </div>
                    </div>
                );
            }

            const [currentWeek, setCurrentWeek] = useState(0);
            const [selectedDay, setSelectedDay] = useState(null);
            const [rescheduleTask, setRescheduleTask] = useState(null);
            const [rescheduleDay, setRescheduleDay] = useState(null);
            const [rescheduleTime, setRescheduleTime] = useState(null);
            const [scheduleData, setScheduleData] = useState(() => {
                const saved = localStorage.getItem('studySchedule');
                return saved ? JSON.parse(saved) : {};
            });
            const [scheduleGenerated, setScheduleGenerated] = useState(false);
            const weekDays = WEEK_DAYS;

            const scheduleConfigKey = useMemo(() => getScheduleConfigKey(userData), [userData]);

            // Persist scheduleData to localStorage
            useEffect(() => {
                if (Object.keys(scheduleData).length > 0) {
                    localStorage.setItem('studySchedule', JSON.stringify(scheduleData));
                    localStorage.setItem('studyScheduleConfig', scheduleConfigKey);
                }
            }, [scheduleData, scheduleConfigKey]);

            const timeSlots = generateTimeSlotsFromUser(userData, userData.dailyCapacity || 2);

            const difficultyColors = {
                'Hard': 'bg-red-500/20 border-red-500/30',
                'Medium': 'bg-amber-500/20 border-amber-500/30',
                'Easy': 'bg-green-500/20 border-green-500/30'
            };

            const schedule = scheduleData;
            const availableDays = (userData.freeDays?.length > 0)
                ? userData.freeDays
                : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

            const maxWeekOffset = useMemo(() => {
                const { latestExam } = getStudyDatesUntilExam(userData);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((latestExam - today) / (1000 * 60 * 60 * 24));
                return Math.max(4, Math.ceil(diffDays / 7) + 1);
            }, [userData]);

            // Generate schedule when component mounts or user config changes
            useEffect(() => {
                if (!userData || !userData.subjects || userData.subjects.length === 0) return;

                const savedConfig = localStorage.getItem('studyScheduleConfig');
                const savedSchedule = localStorage.getItem('studySchedule');

                if (savedConfig === scheduleConfigKey && savedSchedule) {
                    try {
                        const parsed = JSON.parse(savedSchedule);
                        const keys = Object.keys(parsed);
                        const isDateBased = keys.length === 0 || keys.some(k => /^\d{4}-\d{2}-\d{2}$/.test(k));
                        const totalTasks = Object.values(parsed).reduce((sum, dayTasks) => sum + dayTasks.length, 0);
                        if (isDateBased && totalTasks > 0) {
                            setScheduleData(parsed);
                            setScheduleGenerated(true);
                            return;
                        }
                    } catch (e) {
                        console.error('Error parsing saved schedule:', e);
                    }
                }

                const newSchedule = generateStudySchedule(userData);
                setScheduleData(newSchedule);
                setScheduleGenerated(true);
            }, [userData, scheduleConfigKey]);

            const getScheduleForDay = (day, time) => {
                const dateKey = getDateForWeekDay(currentWeek, day);
                const daySchedule = schedule[dateKey] || schedule[day];
                return daySchedule?.find(item => item.time === time);
            };

            const getTaskCountForDay = (day) => {
                const dateKey = getDateForWeekDay(currentWeek, day);
                return (schedule[dateKey] || schedule[day] || []).length;
            };

            const handleReschedule = (taskId, newDay, newTime) => {
                let foundTask = null;
                let oldDateKey = null;

                Object.keys(schedule).forEach(dateKey => {
                    const taskIndex = schedule[dateKey].findIndex(t => t.id === taskId);
                    if (taskIndex !== -1) {
                        foundTask = schedule[dateKey][taskIndex];
                        oldDateKey = dateKey;
                    }
                });

                if (foundTask && oldDateKey) {
                    const updated = { ...schedule };
                    updated[oldDateKey] = updated[oldDateKey].filter(t => t.id !== taskId);
                    const newDateKey = getDateForWeekDay(currentWeek, newDay);
                    if (!updated[newDateKey]) updated[newDateKey] = [];
                    updated[newDateKey].push({
                        ...foundTask,
                        time: newTime
                    });
                    setScheduleData(updated);
                    setRescheduleTask(null);
                    setRescheduleDay(null);
                    setRescheduleTime(null);
                }
            };

            const handleMissSession = (taskId) => {
                let foundTask = null;
                let oldDateKey = null;

                Object.keys(schedule).forEach(dateKey => {
                    const taskIndex = schedule[dateKey].findIndex(t => t.id === taskId);
                    if (taskIndex !== -1) {
                        foundTask = schedule[dateKey][taskIndex];
                        oldDateKey = dateKey;
                    }
                });

                if (foundTask && oldDateKey) {
                    const updated = { ...schedule };
                    updated[oldDateKey] = updated[oldDateKey].filter(t => t.id !== taskId);

                    const { studyDates } = getStudyDatesUntilExam(userData);
                    const oldDate = new Date(oldDateKey + 'T12:00:00');
                    const nextDate = studyDates.find(d => d > oldDate);

                    if (nextDate) {
                        const nextDateKey = formatDateKey(nextDate);
                        if (!updated[nextDateKey]) updated[nextDateKey] = [];
                        updated[nextDateKey].push(foundTask);
                        setScheduleData(updated);
                        alert(`Session rescheduled to ${getDayAbbrev(nextDate)} (${nextDateKey})`);
                    } else {
                        alert('No upcoming free study day found before your exam.');
                        setScheduleData(updated);
                    }
                }
            };

            const getWeekDates = (weekOffset) => {
                const monday = getMondayOfWeek(new Date(), weekOffset);
                return weekDays.map((_, index) => {
                    const date = new Date(monday);
                    date.setDate(monday.getDate() + index);
                    return date.getDate();
                });
            };

            const currentWeekDates = getWeekDates(currentWeek);

            return (
                <div className="container mx-auto px-4 py-8">
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-amber-400 mb-2">Spaced Study Plan</h2>
                        <p className="text-slate-400 italic font-serif">A well-organized mind is a powerful asset</p>
                    </div>
                    <div className="bg-slate-900/90 border border-amber-500/20 rounded-lg p-6 mb-6">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-xl font-semibold text-amber-400">Weekly Overview</h3>
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setCurrentWeek(Math.max(-4, currentWeek - 1))}
                                    className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-amber-400 transition-all"
                                >
                                    &lt;
                                </button>
                                <div className="flex items-center gap-2 text-slate-400">
                                    <span>📅</span>
                                    <span className="text-sm">Week {currentWeek === 0 ? '(Current)' : currentWeek > 0 ? `(+${currentWeek})` : `(${currentWeek})`}</span>
                                </div>
                                <button 
                                    onClick={() => setCurrentWeek(Math.min(maxWeekOffset, currentWeek + 1))}
                                    className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-amber-400 transition-all"
                                >
                                    &gt;
                                </button>
                            </div>
                        </div>
                        <div className="grid grid-cols-7 gap-2">
                            {weekDays.map((day, index) => (
                                <div 
                                    key={day} 
                                    onClick={() => availableDays.includes(day) && setSelectedDay(selectedDay === day ? null : day)}
                                    className={`p-3 rounded-lg text-center transition-all duration-300 ${
                                        !availableDays.includes(day)
                                            ? 'bg-slate-900/30 border border-slate-800 opacity-40 cursor-not-allowed'
                                            : selectedDay === day 
                                                ? 'bg-amber-500/30 border-2 border-amber-500 cursor-pointer' 
                                                : 'bg-slate-800/50 border border-slate-700 hover:border-amber-500/50 cursor-pointer'
                                    }`}
                                >
                                    <p className="text-slate-400 text-xs mb-1">{day}</p>
                                    <p className="text-white font-semibold">{currentWeekDates[index]}</p>
                                    <p className="text-xs text-amber-400 mt-1">
                                        {availableDays.includes(day) ? `${getTaskCountForDay(day)} tasks` : '—'}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-slate-900/90 border border-amber-500/20 rounded-lg p-6 overflow-x-auto">
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">
                            {selectedDay ? `${selectedDay}'s Schedule` : 'Detailed Schedule'}
                        </h3>
                        <div className="min-w-[800px]">
                            {selectedDay ? (
                                <div>
                                    <div className="grid grid-cols-2 gap-2 mb-2">
                                        <div className="text-slate-400 text-sm font-medium">Time</div>
                                        <div className="text-slate-400 text-sm font-medium text-center">Task</div>
                                    </div>
                                    {timeSlots.map((time) => {
                                        const scheduleItem = getScheduleForDay(selectedDay, time);
                                        return (
                                            <div key={time} className="grid grid-cols-2 gap-2 mb-2">
                                                <div className="flex items-center gap-2 text-slate-400 text-sm">
                                                    <span>⏰</span>
                                                    {time}
                                                </div>
                                                <div className="min-h-[60px]">
                                                    {scheduleItem ? (
                                                        <div className={`p-2 rounded border hover:opacity-80 transition-all relative ${completedTasks.includes(scheduleItem.id) ? 'bg-slate-700/50 border-slate-600' : scheduleItem.color}`}>
                                                            <div 
                                                                onClick={() => setRescheduleTask(scheduleItem)}
                                                                className="cursor-pointer"
                                                            >
                                                                <p className={`text-xs font-medium ${completedTasks.includes(scheduleItem.id) ? 'text-slate-400 line-through' : 'text-white'}`}>{scheduleItem.subject}</p>
                                                                <p className={`text-xs truncate ${completedTasks.includes(scheduleItem.id) ? 'text-slate-500 line-through' : 'text-slate-300'}`}>{scheduleItem.topic}</p>
                                                            </div>
                                                            <button
                                                                onClick={(e) => { e.stopPropagation(); handleMissSession(scheduleItem.id); }}
                                                                className="absolute top-1 right-1 text-xs text-red-400 hover:text-red-300 opacity-0 hover:opacity-100 transition-opacity"
                                                                title="Miss session"
                                                            >
                                                                ✕
                                                            </button>
                                                        </div>
                                                    ) : (
                                                        <div className="h-full min-h-[60px] rounded bg-slate-800/30 border border-slate-700/30" />
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div>
                                    <div className="grid grid-cols-8 gap-2 mb-2">
                                        <div className="text-slate-400 text-sm font-medium">Time</div>
                                        {weekDays.map((day) => (
                                            <div key={day} className="text-slate-400 text-sm font-medium text-center">{day}</div>
                                        ))}
                                    </div>
                                    {timeSlots.map((time) => (
                                        <div key={time} className="grid grid-cols-8 gap-2 mb-2">
                                            <div className="flex items-center gap-2 text-slate-400 text-sm">
                                                <span>⏰</span>
                                                {time}
                                            </div>
                                            {weekDays.map((day) => {
                                                const scheduleItem = getScheduleForDay(day, time);
                                                return (
                                                    <div key={`${day}-${time}`} className="min-h-[60px]">
                                                        {scheduleItem ? (
                                                            <div 
                                                                onClick={() => setRescheduleTask(scheduleItem)}
                                                                className={`p-2 rounded border ${scheduleItem.color} hover:opacity-80 transition-all cursor-pointer relative`}
                                                            >
                                                                <p className="text-white text-xs font-medium">{scheduleItem.subject}</p>
                                                                <p className="text-slate-300 text-xs truncate">{scheduleItem.topic}</p>
                                                            </div>
                                                        ) : (
                                                            <div className="h-full min-h-[60px] rounded bg-slate-800/30 border border-slate-700/30" />
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="mt-6 p-6 bg-gradient-to-r from-purple-500/10 to-blue-500/10 border border-purple-500/30 rounded-lg">
                        <div className="flex items-start gap-4">
                            <div className="p-3 bg-purple-500/20 rounded-lg">
                                <span className="text-2xl">📅</span>
                            </div>
                            <div className="flex-1">
                                <h4 className="text-lg font-semibold text-purple-400 mb-2">Spaced Repetition Active</h4>
                                <p className="text-slate-300 text-sm mb-3">
                                    Your schedule uses spaced repetition to optimize learning. Review sessions are automatically scheduled at increasing intervals.
                                </p>
                                <button className="flex items-center gap-2 text-purple-400 hover:text-purple-300 transition-colors">
                                    <span>Learn more about the algorithm</span>
                                    <span>→</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Reschedule Modal */}
                    {rescheduleTask && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-sm">
                            <div className="relative w-full max-w-md p-8 bg-slate-900/90 border border-amber-500/30 rounded-lg shadow-[0_0_30px_rgba(251,191,36,0.2)]">
                                <button onClick={() => { setRescheduleTask(null); setRescheduleDay(null); setRescheduleTime(null); }} className="absolute top-4 right-4 text-slate-400 hover:text-amber-400 transition-colors">
                                    ✕
                                </button>
                                <h3 className="text-2xl font-bold text-amber-400 mb-4">Reschedule Session</h3>
                                <div className="mb-4 p-4 bg-slate-800/50 rounded-lg">
                                    <p className="text-white font-medium">{rescheduleTask.subject}</p>
                                    <p className="text-slate-400 text-sm">{rescheduleTask.topic}</p>
                                    <p className="text-slate-500 text-xs mt-1">Current: {rescheduleTask.time}</p>
                                </div>
                                <p className="text-slate-300 mb-2">Select new day:</p>
                                <div className="grid grid-cols-4 gap-2 mb-4">
                                    {availableDays.map(day => (
                                        <button
                                            key={day}
                                            onClick={() => setRescheduleDay(day)}
                                            className={`py-2 px-3 border rounded-lg text-white text-sm transition-all ${
                                                rescheduleDay === day 
                                                    ? 'bg-amber-500/20 border-amber-500/50' 
                                                    : 'bg-slate-800 border-slate-700 hover:bg-amber-500/20 hover:border-amber-500/50'
                                            }`}
                                        >
                                            {day}
                                        </button>
                                    ))}
                                </div>
                                {rescheduleDay && (
                                    <>
                                        <p className="text-slate-300 mb-2">Select new time:</p>
                                        <div className="grid grid-cols-3 gap-2 mb-4">
                                            {timeSlots.map(time => (
                                                <button
                                                    key={time}
                                                    onClick={() => setRescheduleTime(time)}
                                                    className={`py-2 px-3 border rounded-lg text-white text-sm transition-all ${
                                                        rescheduleTime === time 
                                                            ? 'bg-amber-500/20 border-amber-500/50' 
                                                            : 'bg-slate-800 border-slate-700 hover:bg-amber-500/20 hover:border-amber-500/50'
                                                    }`}
                                                >
                                                    {time}
                                                </button>
                                            ))}
                                        </div>
                                    </>
                                )}
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => { setRescheduleTask(null); setRescheduleDay(null); setRescheduleTime(null); }}
                                        className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => rescheduleDay && rescheduleTime && handleReschedule(rescheduleTask.id, rescheduleDay, rescheduleTime)}
                                        disabled={!rescheduleDay || !rescheduleTime}
                                        className={`flex-1 py-2 rounded-lg transition-all ${
                                            rescheduleDay && rescheduleTime 
                                                ? 'bg-amber-500 hover:bg-amber-600 text-slate-950' 
                                                : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                                        }`}
                                    >
                                        Confirm
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Progress View
        function ProgressView({ userData, completedTasks, studyHours, subjectTime, streak }) {
            if (!userData) {
                return (
                    <div className="container mx-auto px-4 py-8">
                        <div className="text-center">
                            <p className="text-slate-400">Loading your progress...</p>
                        </div>
                    </div>
                );
            }

            const [hoveredDay, setHoveredDay] = useState(null);
            const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            // Generate schedule for calendar hover (respect user's free days)
            const generateCalendarSchedule = () => {
                const schedule = {};
                const availableDays = (userData.freeDays?.length > 0)
                    ? userData.freeDays
                    : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
                const subjects = userData.subjects.filter(s => s.name);
                const dailyCapacity = userData.dailyCapacity || 2;

                const allItems = [];
                subjects.forEach((subject) => {
                    subject.subtopics.filter(t => t).forEach((subtopic) => {
                        allItems.push({
                            subject: subject.name,
                            topic: subtopic,
                            difficulty: subject.difficulty
                        });
                    });
                });

                let dayIdx = 0;
                let tasksOnDay = 0;
                allItems.forEach((item) => {
                    const day = availableDays[dayIdx % availableDays.length];
                    if (!schedule[day]) schedule[day] = [];
                    schedule[day].push(item);
                    tasksOnDay++;
                    if (tasksOnDay >= dailyCapacity) {
                        tasksOnDay = 0;
                        dayIdx++;
                    }
                });

                return schedule;
            };

            const calendarSchedule = generateCalendarSchedule();

            const colors = [
                'bg-purple-500',
                'bg-blue-500',
                'bg-green-500',
                'bg-red-500',
                'bg-emerald-500',
                'bg-amber-500',
            ];

            // Calculate progress per subject based on completed tasks
            const subjectProgress = userData.subjects
                .filter(s => s.name)
                .map((subject, index) => {
                    const subjectTasks = subject.subtopics.filter(t => t);
                    const completedInSubject = subjectTasks.filter(t => completedTasks.includes(`${subject.name}-${t}`)).length;
                    const progress = subjectTasks.length > 0 ? Math.round((completedInSubject / subjectTasks.length) * 100) : 0;
                    const timeSpent = subjectTime[subject.name] || 0;
                    const recommendedHours = userData.recommendedHours?.[subject.id] || 
                                             (subject.difficulty === 'Hard' ? 40 : subject.difficulty === 'Medium' ? 25 : 15);
                    const hoursProgress = recommendedHours > 0 ? Math.round((timeSpent / recommendedHours) * 100) : 0;
                    
                    return {
                        subject: subject.name,
                        progress: progress,
                        color: colors[index % colors.length],
                        timeSpent: timeSpent,
                        recommendedHours: recommendedHours,
                        hoursProgress: hoursProgress
                    };
                });

            const totalSubtopics = userData.subjects.reduce((acc, subject) => {
                return acc + subject.subtopics.filter(t => t).length;
            }, 0);

            const achievements = [
                { icon: '🏆', title: 'First Steps', description: 'Complete your first study session', unlocked: completedTasks.length > 0 },
                { icon: '🔥', title: 'Week Warrior', description: 'Maintain a 7-day streak', unlocked: streak >= 7 },
                { icon: '📚', title: 'Bookworm', description: `Study ${userData.dailyCapacity * 7} hours total`, unlocked: studyHours >= userData.dailyCapacity * 7 },
                { icon: '⚡', title: 'Focus Master', description: 'Achieve 90% focus score', unlocked: completedTasks.length > 0 && (completedTasks.length / totalSubtopics) >= 0.9 },
                { icon: '🌟', title: 'Perfect Week', description: 'Complete all daily tasks', unlocked: completedTasks.length === totalSubtopics },
                { icon: '🎯', title: 'Goal Setter', description: 'Achieve monthly goals', unlocked: streak >= 30 },
            ];

            const weeklyStats = [
                { label: 'Study Hours', value: `${studyHours.toFixed(1)}h`, change: '+0%', icon: '⏰' },
                { label: 'Tasks Completed', value: completedTasks.length.toString(), change: '+0%', icon: '🎯' },
                { label: 'Focus Score', value: completedTasks.length > 0 ? `${Math.round((completedTasks.length / totalSubtopics) * 100)}%` : '0%', change: '+0%', icon: '📈' },
                { label: 'Current Streak', value: `${streak} days`, change: '+0', icon: '�' },
            ];

            return (
                <div className="container mx-auto px-4 py-8">
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-amber-400 mb-2">Your Progress</h2>
                        <p className="text-slate-400 italic font-serif">Track your magical journey through knowledge</p>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        {weeklyStats.map((stat) => (
                            <div key={stat.label} className="bg-slate-900/90 border border-amber-500/20 rounded-lg p-4 hover:border-amber-500/40 transition-all duration-300">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-amber-400 text-xl">{stat.icon}</span>
                                    <span className={`text-sm ${stat.change.startsWith('+') ? 'text-green-400' : 'text-slate-400'}`}>
                                        {stat.change}
                                    </span>
                                </div>
                                <p className="text-2xl font-bold text-white">{stat.value}</p>
                                <p className="text-slate-400 text-sm">{stat.label}</p>
                            </div>
                        ))}
                    </div>
                    <div className="bg-slate-900/90 border border-amber-500/20 rounded-lg p-6 mb-6">
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-xl font-semibold text-amber-400">Subject Mastery</h3>
                            <div className="flex items-center gap-2 text-slate-400">
                                <span>📊</span>
                                <span className="text-sm">Overall: 69%</span>
                            </div>
                        </div>
                        <div className="space-y-4">
                            {subjectProgress.map((item) => (
                                <div key={item.subject}>
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-white font-medium">{item.subject}</span>
                                        <div className="flex items-center gap-3">
                                            <span className="text-slate-400 text-sm">{item.progress}%</span>
                                            <span className="text-amber-400 text-xs">{item.timeSpent.toFixed(1)}h / {item.recommendedHours}h</span>
                                        </div>
                                    </div>
                                    
                                    {/* Overall Mastery Progress (till exam) */}
                                    <div className="flex items-center justify-between mb-1">
                                        <span className="text-xs text-slate-500">Overall Mastery (till exam)</span>
                                        <span className="text-xs text-amber-400">{item.progress}%</span>
                                    </div>
                                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden mb-2">
                                        <div className={`h-full ${item.color} rounded-full transition-all duration-500`} style={{ width: `${item.progress}%` }} />
                                    </div>
                                    
                                    {/* Study Hours Progress */}
                                    <div className="flex items-center justify-between mb-1">
                                        <span className="text-xs text-slate-500">Study Hours Progress</span>
                                        <span className="text-xs text-amber-400">{item.hoursProgress}%</span>
                                    </div>
                                    <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                        <div className={`h-full bg-amber-500/80 rounded-full transition-all duration-500`} style={{ width: `${item.hoursProgress}%` }} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-slate-900/90 border border-amber-500/20 rounded-lg p-6 mb-6">
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-xl font-semibold text-amber-400">Achievements</h3>
                            <div className="flex items-center gap-2 text-slate-400">
                                <span>🏆</span>
                                <span className="text-sm">3/6 Unlocked</span>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {achievements.map((achievement) => (
                                <div key={achievement.title} className={`p-4 rounded-lg border transition-all duration-300 ${
                                    achievement.unlocked ? 'bg-amber-500/10 border-amber-500/30' : 'bg-slate-800/50 border-slate-700 opacity-50'
                                }`}>
                                    <div className={`text-3xl mb-2 ${achievement.unlocked ? '' : 'grayscale'}`}>
                                        {achievement.icon}
                                    </div>
                                    <h4 className="text-white font-semibold mb-1">{achievement.title}</h4>
                                    <p className="text-slate-400 text-sm">{achievement.description}</p>
                                    {achievement.unlocked && (
                                        <div className="mt-2 text-xs text-amber-400">✓ Unlocked</div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-slate-900/90 border border-amber-500/20 rounded-lg p-6 relative">
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Study Streak</h3>
                        <div className="grid grid-cols-7 gap-2">
                            {weekDays.map((day) => (
                                <div key={day} className="text-center text-slate-400 text-xs mb-2">{day}</div>
                            ))}
                            {Array.from({ length: 28 }).map((_, i) => {
                                const dayIndex = i % 7;
                                const dayName = weekDays[dayIndex];
                                const isActive = i < 5 || (i >= 7 && i < 12) || (i >= 14 && i < 19);
                                return (
                                    <div 
                                        key={i} 
                                        onMouseEnter={() => setHoveredDay(dayName)}
                                        onMouseLeave={() => setHoveredDay(null)}
                                        className={`aspect-square rounded flex items-center justify-center text-xs cursor-pointer relative ${
                                            isActive ? 'bg-amber-500/80 text-slate-950 font-semibold' : 'bg-slate-800/50 text-slate-500'
                                        }`}
                                    >
                                        {i + 1}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="mt-4 flex items-center justify-between text-sm">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-amber-500/80 rounded" />
                                <span className="text-slate-400">Studied</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-slate-800/50 rounded" />
                                <span className="text-slate-400">Rest Day</span>
                            </div>
                            <div className="text-amber-400 font-semibold">Current Streak: {streak} Days</div>
                        </div>

                        {/* Hover tooltip */}
                        {hoveredDay && calendarSchedule[hoveredDay] && (
                            <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 p-4 bg-slate-800 border border-amber-500/30 rounded-lg shadow-xl z-10 w-64">
                                <h4 className="text-amber-400 font-semibold mb-2">{hoveredDay}'s Schedule</h4>
                                <div className="space-y-2 max-h-40 overflow-y-auto">
                                    {calendarSchedule[hoveredDay].map((item, index) => (
                                        <div key={index} className="text-sm">
                                            <p className="text-white font-medium">{item.subject}</p>
                                            <p className="text-slate-400 text-xs">{item.topic}</p>
                                            <span className={`text-xs px-2 py-0.5 rounded ${
                                                item.difficulty === 'Hard' ? 'bg-red-500/20 text-red-400' :
                                                item.difficulty === 'Medium' ? 'bg-amber-500/20 text-amber-400' :
                                                'bg-green-500/20 text-green-400'
                                            }`}>
                                                {item.difficulty}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(true);
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [activeTab, setActiveTab] = useState('room');
            const [userData, setUserData] = useState(null);
            const [completedTasks, setCompletedTasks] = useState([]);
            const [studyHours, setStudyHours] = useState(0);
            const [subjectTime, setSubjectTime] = useState({});
            const [streak, setStreak] = useState(0);
            const [lastStudyDate, setLastStudyDate] = useState(null);
            const [activeGoal, setActiveGoal] = useState(null);

            const handleLogin = () => {
                setIsLoggedIn(true);
                setShowLoginModal(false);
                setShowOnboarding(true);
            };

            const handleOnboardingComplete = (formData) => {
                localStorage.removeItem('studySchedule');
                localStorage.removeItem('studyScheduleConfig');
                // Merge new subjects with existing ones instead of replacing
                setUserData(prevData => {
                    if (!prevData) {
                        return formData;
                    }
                    // Add new subjects to existing ones
                    const existingSubjects = prevData.subjects || [];
                    const newSubjects = formData.subjects || [];
                    
                    // Filter out subjects with same name to avoid duplicates
                    const existingNames = new Set(existingSubjects.map(s => s.name));
                    const uniqueNewSubjects = newSubjects.filter(s => !existingNames.has(s.name));
                    
                    return {
                        ...prevData,
                        subjects: [...existingSubjects, ...uniqueNewSubjects],
                        // Update other fields if they changed
                        dailyCapacity: formData.dailyCapacity || prevData.dailyCapacity,
                        learningStyle: formData.learningStyle || prevData.learningStyle,
                        freeTimeSlots: formData.freeTimeSlots || prevData.freeTimeSlots,
                        freeDays: formData.freeDays || prevData.freeDays,
                        includeWeekends: formData.includeWeekends !== undefined ? formData.includeWeekends : prevData.includeWeekends
                    };
                });
                setShowOnboarding(false);
            };

            const handleTabChange = (tab) => {
                setActiveTab(tab);
            };

            const handleSummonSchedule = () => {
                setShowOnboarding(true);
            };

            const handleTaskComplete = (taskId) => {
                if (completedTasks.includes(taskId)) {
                    setCompletedTasks(completedTasks.filter(id => id !== taskId));
                    setStudyHours(prev => Math.max(0, prev - 0.5));
                    // Update subject time
                    const subject = taskId.split('-')[0];
                    setSubjectTime(prev => ({
                        ...prev,
                        [subject]: Math.max(0, (prev[subject] || 0) - 0.5)
                    }));
                } else {
                    setCompletedTasks([...completedTasks, taskId]);
                    setStudyHours(prev => prev + 0.5);
                    // Update subject time
                    const subject = taskId.split('-')[0];
                    setSubjectTime(prev => ({
                        ...prev,
                        [subject]: (prev[subject] || 0) + 0.5
                    }));
                    // Update streak
                    const today = new Date().toDateString();
                    if (lastStudyDate !== today) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        if (lastStudyDate === yesterday.toDateString()) {
                            setStreak(prev => prev + 1);
                        } else {
                            setStreak(1);
                        }
                        setLastStudyDate(today);
                    }
                }
            };

            const renderActiveView = () => {
                switch (activeTab) {
                    case 'room': return <DashboardView userData={userData} completedTasks={completedTasks} onTaskComplete={handleTaskComplete} studyHours={studyHours} subjectTime={subjectTime} activeGoal={activeGoal} setActiveGoal={setActiveGoal} />;
                    case 'spaced': return <SpacedPlanView userData={userData} completedTasks={completedTasks} onTaskComplete={handleTaskComplete} />;
                    case 'progress': return <ProgressView userData={userData} completedTasks={completedTasks} studyHours={studyHours} subjectTime={subjectTime} streak={streak} />;
                    default: return <DashboardView userData={userData} completedTasks={completedTasks} onTaskComplete={handleTaskComplete} studyHours={studyHours} subjectTime={subjectTime} activeGoal={activeGoal} setActiveGoal={setActiveGoal} />;
                }
            };

            return (
                <div className="min-h-screen bg-slate-950">
                    <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLogin={handleLogin} />
                    {showOnboarding && (
                        <OnboardingForm onComplete={handleOnboardingComplete} onClose={() => setShowOnboarding(false)} />
                    )}
                    {isLoggedIn && userData && (
                        <>
                            <Header activeTab={activeTab} onTabChange={handleTabChange} onSummonSchedule={handleSummonSchedule} userData={userData} />
                            <div className="min-h-[calc(100vh-80px)]">
                                {renderActiveView()}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
