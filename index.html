<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Room of Requirement - Adaptive Study Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.3); }
            100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-glow { animation: glow 2s ease-in-out infinite alternate; }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const WEEK_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const REVIEW_INTERVALS = [3, 7, 14];

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDayAbbrev(date) {
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function getMondayOfWeek(baseDate, weekOffset = 0) {
            const d = new Date(baseDate);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff + weekOffset * 7);
            return d;
        }

        function getDateForWeekDay(weekOffset, dayAbbrev) {
            const monday = getMondayOfWeek(new Date(), weekOffset);
            const dayIndex = WEEK_DAYS.indexOf(dayAbbrev);
            const date = new Date(monday);
            date.setDate(monday.getDate() + dayIndex);
            return formatDateKey(date);
        }

        function generateTimeSlotsFromUser(userData, slotCount) {
            const slots = [];
            const startHour = parseInt(userData.freeTimeSlots?.start?.split(':')[0]) || 9;
            const endHour = parseInt(userData.freeTimeSlots?.end?.split(':')[0]) || 21;
            const count = Math.min(slotCount, Math.max(1, endHour - startHour));
            for (let i = 0; i < count; i++) {
                const hour = startHour + i;
                const ampm = hour >= 12 ? 'PM' : 'AM';
                const displayHour = hour > 12 ? hour - 12 : hour === 0 ? 12 : hour;
                slots.push(`${displayHour} ${ampm}`);
            }
            return slots;
        }

        function getStudyDatesUntilExam(userData) {
            const availableDays = (userData.freeDays?.length > 0)
                ? userData.freeDays
                : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

            const subjects = userData.subjects.filter(s => s.name);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const examDates = subjects
                .map(s => userData.examDeadlines?.[s.id])
                .filter(Boolean)
                .map(d => {
                    const exam = new Date(d + 'T12:00:00');
                    exam.setHours(0, 0, 0, 0);
                    return exam;
                });

            const defaultEnd = new Date(today);
            defaultEnd.setDate(defaultEnd.getDate() + 28);

            const latestExam = examDates.length > 0
                ? new Date(Math.max(...examDates.map(e => e.getTime())))
                : defaultEnd;

            const studyDates = [];
            const cursor = new Date(today);
            while (cursor <= latestExam) {
                if (availableDays.includes(getDayAbbrev(cursor))) {
                    studyDates.push(new Date(cursor));
                }
                cursor.setDate(cursor.getDate() + 1);
            }

            if (studyDates.length === 0) {
                const fallback = new Date(today);
                for (let i = 0; i < 28; i++) {
                    if (availableDays.includes(getDayAbbrev(fallback))) {
                        studyDates.push(new Date(fallback));
                    }
                    fallback.setDate(fallback.getDate() + 1);
                }
            }

            return { studyDates, latestExam, availableDays };
        }

        function generateStudySchedule(userData) {
            const { studyDates, latestExam, availableDays } = getStudyDatesUntilExam(userData);
            const dailyCapacity = userData.dailyCapacity || 2;
            const timeSlots = generateTimeSlotsFromUser(userData, dailyCapacity);
            const maxTasksPerDay = Math.min(dailyCapacity, timeSlots.length);

            const difficultyColors = {
                'Hard': 'bg-red-500/20 border-red-500/30',
                'Medium': 'bg-amber-500/20 border-amber-500/30',
                'Easy': 'bg-green-500/20 border-green-500/30'
            };
            const difficultyPriority = { 'Hard': 3, 'Medium': 2, 'Easy': 1 };

            const subjects = userData.subjects.filter(s => s.name);
            const sortedSubjects = [...subjects].sort((a, b) =>
                difficultyPriority[b.difficulty] - difficultyPriority[a.difficulty]
            );

            const initialTasks = [];
            sortedSubjects.forEach((subject) => {
                const color = difficultyColors[subject.difficulty] || difficultyColors['Medium'];
                subject.subtopics.filter(t => t).forEach((subtopic) => {
                    initialTasks.push({
                        subject: subject.name,
                        topic: subtopic,
                        color,
                        difficulty: subject.difficulty,
                        id: `${subject.name}-${subtopic}`,
                        subjectId: subject.id
                    });
                });
            });

            const scheduleByDate = {};
            const countOnDate = (key) => (scheduleByDate[key] || []).length;

            const placeSession = (date, session) => {
                const dateKey = formatDateKey(date);
                if (!scheduleByDate[dateKey]) scheduleByDate[dateKey] = [];
                const slotIndex = scheduleByDate[dateKey].length;
                if (slotIndex >= maxTasksPerDay) return false;
                scheduleByDate[dateKey].push({
                    time: timeSlots[slotIndex],
                    subject: session.subject,
                    topic: session.topic,
                    color: session.color,
                    difficulty: session.difficulty,
                    id: session.id,
                    sessionType: session.sessionType || 'study'
                });
                return true;
            };

            // Distribute initial study tasks across all free days until placed
            let dateIdx = 0;
            let taskIdx = 0;
            let safety = 0;
            const maxSafety = Math.max(studyDates.length * initialTasks.length * 2, 1);

            while (taskIdx < initialTasks.length && safety < maxSafety) {
                const date = studyDates[dateIdx % studyDates.length];
                const dateKey = formatDateKey(date);
                if (countOnDate(dateKey) < maxTasksPerDay) {
                    placeSession(date, { ...initialTasks[taskIdx], sessionType: 'study' });
                    taskIdx++;
                }
                dateIdx++;
                safety++;
            }

            // Schedule spaced-repetition reviews until each subject's exam
            initialTasks.forEach((task) => {
                let initialDate = null;
                for (const date of studyDates) {
                    const key = formatDateKey(date);
                    if ((scheduleByDate[key] || []).some(s => s.id === task.id)) {
                        initialDate = date;
                        break;
                    }
                }
                if (!initialDate) return;

                const subjectExamStr = userData.examDeadlines?.[task.subjectId];
                const subjectExam = subjectExamStr
                    ? new Date(subjectExamStr + 'T12:00:00')
                    : latestExam;

                REVIEW_INTERVALS.forEach((interval, idx) => {
                    const reviewTarget = new Date(initialDate);
                    reviewTarget.setDate(reviewTarget.getDate() + interval);
                    if (reviewTarget > subjectExam) return;

                    const startIdx = studyDates.findIndex(d => d >= reviewTarget);
                    if (startIdx === -1) return;

                    for (let i = startIdx; i < studyDates.length; i++) {
                        const d = studyDates[i];
                        if (d > subjectExam) break;
                        const key = formatDateKey(d);
                        if (countOnDate(key) < maxTasksPerDay) {
                            placeSession(d, {
                                ...task,
                                id: `${task.id}-review-${idx + 1}`,
                                topic: `Review: ${task.topic}`,
                                sessionType: 'review'
                            });
                            break;
                        }
                    }
                });
            });

            return scheduleByDate;
        }

        function getScheduleConfigKey(userData) {
            if (!userData) return '';
            return JSON.stringify({
                subjects: userData.subjects,
                freeDays: userData.freeDays,
                dailyCapacity: userData.dailyCapacity,
                examDeadlines: userData.examDeadlines,
                freeTimeSlots: userData.freeTimeSlots,
                recommendedHours: userData.recommendedHours
            });
        }

        // Login Modal Component
        function LoginModal({ isOpen, onClose, onLogin }) {
            const [isLoading, setIsLoading] = useState(false);
            const [loadingText, setLoadingText] = useState('');

            const handleLogin = async () => {
                setIsLoading(true);
                setLoadingText('Alohomora... Opening Room');
                await new Promise(resolve => setTimeout(resolve, 800));
                onLogin();
                setIsLoading(false);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-sm">
                    <div className="relative w-full max-w-md p-8 bg-slate-900/90 border border-amber-500/30 rounded-lg shadow-[0_0_30px_rgba(251,191,36,0.2)]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-amber-400 transition-colors">
                            ✕
                        </button>
                        <div className="text-center mb-6">
                            <div className="inline-block p-3 mb-4 bg-amber-500/10 rounded-full">
                                <span className="text-3xl">🪄</span>
                            </div>
                            <h2 className="text-2xl font-bold text-amber-400 mb-2">Enter the Room</h2>
                            <p className="text-slate-400 italic font-serif">You See It When You Need It</p>
                        </div>
                        <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 mb-6">
                            <p className="text-amber-400 text-sm text-center">
                                ✨ Demo Credentials Pre-filled. Click 'Quick Magic Login' to enter.
                            </p>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Username</label>
                                <input type="text" defaultValue="potter_student" readOnly
                                    className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition-all" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Password</label>
                                <input type="password" defaultValue="lumos123" readOnly
                                    className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition-all" />
                            </div>
                            <button onClick={handleLogin} disabled={isLoading}
                                className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-[0_0_15px_rgba(251,191,36,0.4)] hover:shadow-[0_0_25px_rgba(251,191,36,0.6)]">
                                {isLoading ? (
                                    <>
                                        <div className="w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin" />
                                        <span>{loadingText}</span>
                                    </>
                                ) : (
                                    <>
                                        <span>🪄</span>
                                        <span>Quick Magic Login</span>
                                    </>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Onboarding Form Component
        function OnboardingForm({ onComplete, onClose }) {
            const [currentStep, setCurrentStep] = useState(1);
            const [formData, setFormData] = useState({
                subjects: [{ id: 1, name: '', subtopics: [''], difficulty: 'Medium' }],
                examDeadlines: {},
                recommendedHours: {},
                dailyCapacity: 2,
                learningStyle: 'Visual',
                freeTimeSlots: { start: '09:00', end: '21:00' },
                freeDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                includeWeekends: false
            });

            const addSubject = () => {
                setFormData({
                    ...formData,
                    subjects: [...formData.subjects, { id: Date.now(), name: '', subtopics: [''], difficulty: 'Medium' }]
                });
            };

            const removeSubject = (id) => {
                setFormData({
                    ...formData,
                    subjects: formData.subjects.filter(s => s.id !== id)
                });
            };

            const updateSubject = (id, field, value) => {
                setFormData({
                    ...formData,
                    subjects: formData.subjects.map(s => s.id === id ? { ...s, [field]: value } : s)
                });
            };

            const addSubtopic = (subjectId) => {
                setFormData({
                    ...formData,
                    subjects: formData.subjects.map(s => 
                        s.id === subjectId ? { ...s, subtopics: [...s.subtopics, ''] } : s
                    )
                });
            };

            const updateSubtopic = (subjectId, index, value) => {
                setFormData({
                    ...formData,
                    subjects: formData.subjects.map(s => 
                        s.id === subjectId ? { ...s, subtopics: s.subtopics.map((t, i) => i === index ? value : t) } : s
                    )
                });
            };

            const removeSubtopic = (subjectId, index) => {
                setFormData({
                    ...formData,
                    subjects: formData.subjects.map(s => 
                        s.id === subjectId ? { ...s, subtopics: s.subtopics.filter((_, i) => i !== index) } : s
                    )
                });
            };

            const updateExamDeadline = (subjectId, date) => {
                setFormData({
                    ...formData,
                    examDeadlines: { ...formData.examDeadlines, [subjectId]: date }
                });
            };

            const updateRecommendedHours = (subjectId, hours) => {
                setFormData({
                    ...formData,
                    recommendedHours: { ...formData.recommendedHours, [subjectId]: hours }
                });
            };

            const handleSubmit = () => {
                onComplete(formData);
            };

            const steps = [
                { title: 'Subjects & Syllabi', description: 'Add your subjects and topics' },
                { title: 'Exam Deadlines', description: 'Set your exam dates' },
                { title: 'Daily Capacity', description: 'How many hours can you study?' },
                { title: 'Learning Style', description: 'Choose your preferred style' }
            ];

            const renderStep1 = () => (
                <div className="space-y-6">
                    <div>
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Add Your Subjects</h3>
                        {formData.subjects.map((subject, sIndex) => (
                            <div key={subject.id} className="bg-slate-800/50 border border-slate-700 rounded-lg p-4 mb-4">
                                <div className="flex items-center gap-4 mb-3">
                                    <input
                                        type="text"
                                        placeholder="Subject name (e.g., Potions)"
                                        value={subject.name}
                                        onChange={(e) => updateSubject(subject.id, 'name', e.target.value)}
                                        className="flex-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none"
                                    />
                                    <select
                                        value={subject.difficulty}
                                        onChange={(e) => updateSubject(subject.id, 'difficulty', e.target.value)}
                                        className="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none"
                                    >
                                        <option value="Easy">Easy</option>
                                        <option value="Medium">Medium</option>
                                        <option value="Hard">Hard</option>
                                    </select>
                                    {formData.subjects.length > 1 && (
                                        <button onClick={() => removeSubject(subject.id)} className="text-red-400 hover:text-red-300">
                                            ✕
                                        </button>
                                    )}
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm text-slate-400">Sub-topics:</label>
                                    {subject.subtopics.map((subtopic, tIndex) => (
                                        <div key={tIndex} className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                placeholder={`Topic ${tIndex + 1}`}
                                                value={subtopic}
                                                onChange={(e) => updateSubtopic(subject.id, tIndex, e.target.value)}
                                                className="flex-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none text-sm"
                                            />
                                            {subject.subtopics.length > 1 && (
                                                <button onClick={() => removeSubtopic(subject.id, tIndex)} className="text-red-400 hover:text-red-300 text-sm">
                                                    ✕
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    <button onClick={() => addSubtopic(subject.id)} className="text-amber-400 hover:text-amber-300 text-sm">
                                        + Add sub-topic
                                    </button>
                                </div>
                            </div>
                        ))}
                        <button onClick={addSubject} className="w-full py-2 border-2 border-dashed border-amber-500/30 rounded-lg text-amber-400 hover:border-amber-500/50 transition-all">
                            + Add Subject
                        </button>
                    </div>
                </div>
            );

            const renderStep2 = () => (
                <div className="space-y-6">
                    <div>
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Set Exam Deadlines & Study Hours</h3>
                        {formData.subjects.filter(s => s.name).map((subject) => {
                            // Calculate recommended hours based on difficulty
                            const baseRecommendedHours = subject.difficulty === 'Hard' ? 40 : 
                                                         subject.difficulty === 'Medium' ? 25 : 15;
                            
                            // Calculate remaining days until exam
                            const examDate = formData.examDeadlines[subject.id];
                            let adjustedRecommendedHours = baseRecommendedHours;
                            let remainingDays = null;
                            
                            if (examDate) {
                                const today = new Date();
                                const exam = new Date(examDate);
                                const diffTime = exam - today;
                                remainingDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                
                                // If exam is closer than recommended hours, adjust to remaining days * 1 hour
                                if (remainingDays > 0 && remainingDays < baseRecommendedHours) {
                                    adjustedRecommendedHours = remainingDays * 1;
                                }
                            }
                            
                            const currentRecommendedHours = formData.recommendedHours?.[subject.id] || adjustedRecommendedHours;
                            
                            return (
                                <div key={subject.id} className="bg-slate-800/50 border border-slate-700 rounded-lg p-4 mb-3">
                                    <label className="block text-sm font-medium text-slate-300 mb-2">{subject.name}</label>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Exam Date</label>
                                            <input
                                                type="date"
                                                value={formData.examDeadlines[subject.id] || ''}
                                                onChange={(e) => updateExamDeadline(subject.id, e.target.value)}
                                                min={new Date().toISOString().split('T')[0]}
                                                className="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Recommended Hours</label>
                                            <input
                                                type="number"
                                                value={currentRecommendedHours}
                                                onChange={(e) => updateRecommendedHours(subject.id, parseInt(e.target.value) || adjustedRecommendedHours)}
                                                className="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none text-sm"
                                            />
                                        </div>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-2">
                                        Based on difficulty: {baseRecommendedHours}h recommended
                                        {remainingDays !== null && remainingDays > 0 && remainingDays < baseRecommendedHours && 
                                            ` (Adjusted to ${remainingDays}h due to ${remainingDays} days until exam)`
                                        }
                                    </p>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderStep3 = () => (
                <div className="space-y-6">
                    <div>
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Daily Study Capacity</h3>
                        <p className="text-slate-400 mb-6">How many hours can you dedicate to studying each day?</p>
                        <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-6 mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <span className="text-4xl font-bold text-amber-400">{formData.dailyCapacity}h</span>
                                <span className="text-slate-400">per day</span>
                            </div>
                            <input
                                type="range"
                                min="1"
                                max="6"
                                value={formData.dailyCapacity}
                                onChange={(e) => setFormData({ ...formData, dailyCapacity: parseInt(e.target.value) })}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500"
                            />
                            <div className="flex justify-between text-xs text-slate-400 mt-2">
                                <span>1h</span>
                                <span>2h</span>
                                <span>3h</span>
                                <span>4h</span>
                                <span>5h</span>
                                <span>6h</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Study Free Time</h3>
                        <p className="text-slate-400 mb-6">When are you available for studying each day?</p>
                        <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-6 mb-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Start Time</label>
                                    <input
                                        type="time"
                                        value={formData.freeTimeSlots.start}
                                        onChange={(e) => setFormData({ 
                                            ...formData, 
                                            freeTimeSlots: { ...formData.freeTimeSlots, start: e.target.value } 
                                        })}
                                        className="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">End Time</label>
                                    <input
                                        type="time"
                                        value={formData.freeTimeSlots.end}
                                        onChange={(e) => setFormData({ 
                                            ...formData, 
                                            freeTimeSlots: { ...formData.freeTimeSlots, end: e.target.value } 
                                        })}
                                        className="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-amber-500 outline-none"
                                    />
                                </div>
                            </div>
                            <p className="text-xs text-slate-400 mt-3">
                                Your study sessions will be scheduled within this time window
                            </p>
                        </div>
                    </div>
                    <div>
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Available Days</h3>
                        <p className="text-slate-400 mb-6">Which days are you available for studying?</p>
                        <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-6 mb-6">
                            <div className="grid grid-cols-5 gap-3 mb-4">
                                {['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map(day => (
                                    <label key={day} className="flex items-center gap-2 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={formData.freeDays.includes(day)}
                                            onChange={(e) => {
                                                if (e.target.checked) {
                                                    setFormData({ ...formData, freeDays: [...formData.freeDays, day] });
                                                } else {
                                                    setFormData({ ...formData, freeDays: formData.freeDays.filter(d => d !== day) });
                                                }
                                            }}
                                            className="w-4 h-4 rounded border-slate-600 bg-slate-700 text-amber-500 focus:ring-amber-500"
                                        />
                                        <span className="text-white text-sm">{day}</span>
                                    </label>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 className="text-xl font-semibold text-amber-400 mb-4">Weekend Study</h3>
                        <p className="text-slate-400 mb-6">Do you want to study on weekends?</p>

            const [currentBreak, setCurrentBreak] = useState(0);

            const [sessionLog, setSessionLog] = useState([]);

                return (

                        </div>
                    </div>
                );
            }

            // Timer effect
            useEffect(() => {
                let interval;
                if (timerRunning && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(prev => prev - 1);
                    }, 1000);
                } else if (timerRunning && timerSeconds === 0) {
                    setTimerRunning(false);
                    if (timerPhase === 'focus') {
                        if (currentBreak < numBreaks) {
                            alert('Focus session complete! Time for a break.');
                            setTimerPhase('break');
                            setTimerSeconds(breakDuration * 60);
                            setCurrentBreak(prev => prev + 1);
                        } else {
                            alert('All sessions complete! Great job!');
                            setSessionLog([...sessionLog, {
                                date: new Date().toLocaleDateString(),
                                duration: timerMinutes,
                                breaks: numBreaks,
                                completedAt: new Date().toLocaleTimeString()
                            }]);
                        }
                    } else {
                        alert('Break over! Ready to focus again?');
                        setTimerPhase('focus');
                        setTimerSeconds(timerMinutes * 60);
                    }
                }
                return () => clearInterval(interval);
            }, [timerRunning, timerSeconds, timerPhase, currentBreak, numBreaks, breakDuration, timerMinutes, sessionLog]);

            // Calculate total sub-topics
            const totalSubtopics = userData.subjects.reduce((acc, subject) => {
                return acc + subject.subtopics.filter(t => t).length;
            }, 0);

            // Generate task cards from user data with proper scheduling
            const upcomingTasks = useMemo(() => {
                const todayAbbrev = getDayAbbrev(new Date());
                const dailyCapacity = userData.dailyCapacity || 2;
                const timeSlots = generateTimeSlotsFromUser(userData, dailyCapacity);
                const availableDays = (userData.freeDays?.length > 0)
                    ? userData.freeDays
                    : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

                const difficultyPriority = { 'Hard': 3, 'Medium': 2, 'Easy': 1 };
                const sortedSubjects = [...userData.subjects].sort((a, b) =>
                    difficultyPriority[b.difficulty] - difficultyPriority[a.difficulty]
                );

                const allTasks = [];
                sortedSubjects.forEach((subject) => {
                    subject.subtopics.filter(t => t).forEach((subtopic) => {
                        allTasks.push({
                            subject: subject.name,
                            topic: subtopic,
                            difficulty: subject.difficulty,
                            priority: difficultyPriority[subject.difficulty],
                            id: `${subject.name}-${subtopic}`
                        });
                    });
                });

                const todaySchedule = [];
                if (availableDays.includes(todayAbbrev)) {
                    timeSlots.forEach((time, index) => {
                        if (index < dailyCapacity && index < allTasks.length) {
                            const task = allTasks[index];
                            todaySchedule.push({
                                id: task.id,
                                subject: task.subject,
                                task: task.topic,
                                time: time,
                                priority: task.difficulty === 'Hard' ? 'high' :
                                         task.difficulty === 'Medium' ? 'medium' : 'low'
                            });
                        }
                    });
                }

                return todaySchedule.slice(0, dailyCapacity);
            }, [userData.subjects, userData.freeTimeSlots, userData.freeDays, userData.dailyCapacity]);

            const stats = [
                { icon: '📚', label: 'Subjects', value: userData.subjects.filter(s => s.name).length.toString(), color: 'text-blue-400' },
                { icon: '⏰', label: 'Study Hours', value: studyHours.toFixed(1), color: 'text-green-400' },
                { icon: '🎯', label: 'Tasks Done', value: `${completedTasks.length}/${totalSubtopics}`, color: 'text-purple-400' },
                { icon: '⚡', label: 'Focus Score', value: completedTasks.length > 0 ? `${Math.round((completedTasks.length / totalSubtopics) * 100)}%` : '0%', color: 'text-amber-400' },

            const priorityColors = {

                low: 'bg-green-500/20 text-green-400 border-green-500/30',
